<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUMP.FUN SNIPER</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 25px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.card {
  background: #151b23;
  border: 1px solid #27313d;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  color: #aeb8c4;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #35404d;
  background: #0d131a;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

.start {
  background: #19c37d;
  color: white;
}

.stop {
  background: #e5484d;
  color: white;
}

.status {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  padding: 15px;
  border-radius: 10px;
  background: #242b34;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #27313d;
}

.token {
  padding: 12px;
  margin-top: 10px;
  background: #0d131a;
  border-radius: 8px;
  border: 1px solid #27313d;
}

.small {
  color: #8d99a8;
  font-size: 13px;
  word-break: break-all;
}

.save {
  background: #3267e3;
  color: white;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 PUMP.FUN SNIPER</h1>

<div class="card">

<label>Amount per token ($)</label>
<input id="amountUsd" type="number" min="1" step="1" value="5">

<label>Hold time (seconds)</label>
<input id="holdSeconds" type="number" min="1" value="30">

<label>Take Profit (%)</label>
<input id="takeProfitPercent" type="number" min="1" value="50">

<label>Stop Loss (%)</label>
<input id="stopLossPercent" type="number" min="1" value="10">

<label>Max open positions</label>
<input id="maxOpenPositions" type="number" min="1" value="10">

<button class="save" onclick="saveConfig()">
💾 SAVE SETTINGS
</button>

</div>

<div class="card">

<div id="status" class="status">
🔴 STOPPED
</div>

<button class="start" onclick="startBot()">
🟢 START BOT
</button>

<button class="stop" onclick="stopBot()">
🔴 STOP BOT
</button>

</div>

<div class="card">

<div class="stat">
<span>Amount / Token</span>
<strong id="showAmount">$5</strong>
</div>

<div class="stat">
<span>Hold Time</span>
<strong id="showHold">30 sec</strong>
</div>

<div class="stat">
<span>Take Profit</span>
<strong id="showTP">+50%</strong>
</div>

<div class="stat">
<span>Stop Loss</span>
<strong id="showSL">-10%</strong>
</div>

<div class="stat">
<span>Max Positions</span>
<strong id="showMax">10</strong>
</div>

<div class="stat">
<span>Open Positions</span>
<strong id="openPositions">0</strong>
</div>

</div>

<div class="card">

<h2>🆕 Latest Token</h2>

<div id="latestToken">
Waiting for new token...
</div>

</div>

</div>

<script>

async function loadConfig() {

  try {

    const response = await fetch("/api/config");
    const config = await response.json();

    document.getElementById("amountUsd").value =
      config.amountUsd ?? 5;

    document.getElementById("holdSeconds").value =
      config.holdSeconds ?? 30;

    document.getElementById("takeProfitPercent").value =
      config.takeProfitPercent ?? 50;

    document.getElementById("stopLossPercent").value =
      config.stopLossPercent ?? 10;

    document.getElementById("maxOpenPositions").value =
      config.maxOpenPositions ?? 10;

    updateDisplay(config);

  } catch (error) {

    console.log("Config error:", error);

  }

}

function updateDisplay(config) {

  document.getElementById("showAmount").textContent =
    "$" + Number(config.amountUsd ?? 5);

  document.getElementById("showHold").textContent =
    Number(config.holdSeconds ?? 30) + " sec";

  document.getElementById("showTP").textContent =
    "+" + Number(config.takeProfitPercent ?? 50) + "%";

  document.getElementById("showSL").textContent =
    "-" + Number(config.stopLossPercent ?? 10) + "%";

  document.getElementById("showMax").textContent =
    Number(config.maxOpenPositions ?? 10);

  const status = document.getElementById("status");

  if (config.botRunning) {

    status.textContent = "🟢 RUNNING";

  } else {

    status.textContent = "🔴 STOPPED";

  }

}

async function saveConfig() {

  const config = {

    amountUsd:
      Number(document.getElementById("amountUsd").value),

    holdSeconds:
      Number(document.getElementById("holdSeconds").value),

    takeProfitPercent:
      Number(document.getElementById("takeProfitPercent").value),

    stopLossPercent:
      Number(document.getElementById("stopLossPercent").value),

    maxOpenPositions:
      Number(document.getElementById("maxOpenPositions").value)

  };

  const response = await fetch("/api/config", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify(config)

  });

  const result = await response.json();

  updateDisplay(result.config);

  alert("Settings saved");

}

async function startBot() {

  await fetch("/api/start", {
    method: "POST"
  });

  await loadConfig();

}

async function stopBot() {

  await fetch("/api/stop", {
    method: "POST"
  });

  await loadConfig();

}

async function updateState() {

  try {

    const response =
      await fetch("/api/state");

    const state =
      await response.json();

    updateDisplay(state.config);

    const positions =
      state.positions || {};

    document.getElementById("openPositions").textContent =
      Object.keys(positions).length;

    const token =
      state.latestToken;

    if (token && token.mint) {

      document.getElementById("latestToken").innerHTML = `

        <strong>${token.name || "N/A"}</strong>

        <br>

        Symbol:
        ${token.symbol || "N/A"}

        <br>

        <span class="small">
        ${token.mint}
        </span>

      `;

    }

  } catch (error) {

    console.log("State error:", error);

  }

}

loadConfig();

setInterval(updateState, 1000);

</script>

</body>
</html>
